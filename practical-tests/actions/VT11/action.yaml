name: VT11 — Проверить существующие 2D-анимации на недостатки
category: visual_testing
instruction: В слепом read-only тесте просмотри исходные кадры указанных 2D-клипов и сопоставь их с briefs.
  Для каждого клипа дай самостоятельный обоснованный вывод с привязкой к кадрам; не предполагай наличие
  дефектов.
