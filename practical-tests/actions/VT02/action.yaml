name: VT02 — Создать 3D-ассет по текстовому заданию
category: visual_testing
instruction: Создай собственную редактируемую low-poly 3D-модель по письменному brief, экспортируй GLB,
  проверь импорт и видимые ракурсы в Godot. Зафиксируй доказательства реального результата для независимого
  оценивания.
