name: VT15 — Независимо оценить завершённую единицу теста
category: visual_testing
instruction: В отдельном чате, получив точные Action, variant, runId и unitId, проверь исходный brief,
  реальные артефакты и QA до чтения самооценки. Сохрани независимое доказательное решение, не изменяя
  результат исполнителя или скрытые ключи.
