name: VT12 — Проверить существующие 3D-анимации на недостатки
category: visual_testing
instruction: В слепом read-only тесте изучи оригинальные последовательности кадров 3D-анимаций и отдельные
  briefs, различая loop, one-shot, посадку и походку. Фиксируй кадры и основания вердиктов, не подменяя
  оригиналы.
