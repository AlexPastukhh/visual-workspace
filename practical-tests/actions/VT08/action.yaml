name: VT08 — Воссоздать 2D по референсу и точечно изменить
category: visual_testing
instruction: Воссоздай редактируемый 2D-объект по PNG, затем в том же чате выполни отдельно присланное
  изменение ограниченной области, сохранив остальные свойства и историю первого результата. Каждый этап
  оценивается независимо.
