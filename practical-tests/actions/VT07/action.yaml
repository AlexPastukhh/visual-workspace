name: VT07 — Точно воспроизвести 2D по одному PNG-референсу
category: visual_testing
instruction: По закреплённому референсному PNG вручную воссоздай собственный редактируемый SVG с максимально
  близким внешним видом, экспортируй PNG и проверь реальный Godot-просмотр. Исходное изображение нельзя
  выдавать за собственную работу.
